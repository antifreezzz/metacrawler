services:
  metacrawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metacrawler
    restart: unless-stopped
    ports:
      - "${PORT:-8079}:8079"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8079
      - DB_PATH=/app/data/metacrawler.db
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 * * * *}
      - CRAWL_DELAY_MIN_MS=${CRAWL_DELAY_MIN_MS:-2000}
      - CRAWL_DELAY_MAX_MS=${CRAWL_DELAY_MAX_MS:-4000}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
