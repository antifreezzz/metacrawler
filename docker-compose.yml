services:
  metacrawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metacrawler
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8079
      - DB_PATH=/app/data/metacrawler.db
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 * * * *}
      - CRAWL_DELAY_MIN_MS=${CRAWL_DELAY_MIN_MS:-2000}
      - CRAWL_DELAY_MAX_MS=${CRAWL_DELAY_MAX_MS:-4000}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set to a strong value}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set to a random value}
      - EMBEDDING_ENGINE=${EMBEDDING_ENGINE:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-local}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:8666/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-auto}
      - WHISPER_URL=${WHISPER_URL:-http://localhost:8666/v1/audio/transcriptions}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8079/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3


