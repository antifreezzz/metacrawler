<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}Metacrawler — Аналитика игр Metacritic{{end}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#020617',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.10"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.4/sse.js"></script>
  <style>
    body { background-color: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    
    /* Modern game score badges */
    .score-green { background: linear-gradient(135deg, #10b981, #059669); color: #022c22; font-weight: 800; border: 1px solid rgba(16, 185, 129, 0.4); }
    .score-yellow { background: linear-gradient(135deg, #f59e0b, #d97706); color: #451a03; font-weight: 800; border: 1px solid rgba(245, 158, 11, 0.4); }
    .score-red { background: linear-gradient(135deg, #ef4444, #dc2626); color: #ffffff; font-weight: 800; border: 1px solid rgba(239, 68, 68, 0.4); }
    .score-tbd { background: #334155; color: #94a3b8; font-weight: 600; border: 1px solid #475569; }

    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    * { scrollbar-width: thin; scrollbar-color: #334155 #090d16; }

    /* Number inputs reset default arrows */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* HTMX loading states */
    .htmx-request.btn-action { opacity: 0.7; pointer-events: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased bg-[#0b1120] text-slate-100" hx-ext="sse" sse-connect="/api/worker/events">
  <!-- Навигация и панель статуса -->
  <header class="border-b border-slate-800/80 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-6">
        <a href="/" class="flex items-center space-x-2 text-xl font-black tracking-tight text-white hover:text-emerald-400 transition-colors">
          <span class="text-2xl">🎮</span>
          <span>META<span class="text-emerald-400">CRAWLER</span></span>
        </a>

        <nav class="hidden sm:flex items-center space-x-2 text-xs font-semibold text-slate-300">
          <a href="/" class="px-3 py-1.5 rounded-lg hover:text-emerald-400 hover:bg-slate-800/60 transition-all">Каталог</a>
          <a href="/monitoring" class="px-3 py-1.5 rounded-lg hover:text-emerald-400 hover:bg-slate-800/60 transition-all flex items-center space-x-1">
            <span>📊 Мониторинг & Запуск</span>
          </a>
        </nav>
      </div>

      <!-- Виджет статуса воркера с live SSE -->
      <div class="flex items-center space-x-3">
        <div id="worker-status-badge" sse-swap="status" class="flex items-center space-x-2 text-xs px-3 py-1.5 rounded-full bg-slate-800/90 border border-slate-700/80 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-slate-300 font-medium">Воркер: Готов</span>
        </div>

        <button hx-post="/api/worker/run" 
                hx-swap="none"
                class="btn-action inline-flex items-center space-x-1.5 px-3.5 py-1.5 border border-emerald-500/40 text-xs font-semibold rounded-lg text-emerald-300 bg-emerald-500/10 hover:bg-emerald-500/20 active:scale-95 transition-all cursor-pointer shadow-sm">
          <span>⚡</span>
          <span>Запустить сбор</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Основной контент -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {{block "content" .}}{{end}}
  </main>

  <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
    <p>Metacrawler &copy; 2026. Парсер и аналитическая платформа игр с поддержкой OpenAI и эмбеддингов.</p>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 pointer-events-none transition-all duration-300"></div>

  <script>
    function showToast(message, isError) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center space-x-2 px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold transform transition-all duration-300 translate-y-2 opacity-0 ${isError ? 'bg-rose-950 border border-rose-500/50 text-rose-200' : 'bg-slate-900 border border-emerald-500/50 text-emerald-200'}`;
      toast.innerHTML = `<span>${isError ? '❌' : '🚀'}</span><span>${message}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    document.body.addEventListener('htmx:afterRequest', function(evt) {
      const url = evt.detail.requestConfig?.path || '';
      if (url.startsWith('/api/worker/run')) {
        if (evt.detail.successful) {
          showToast('Команда воркеру успешно отправлена');
        } else {
          showToast('Ошибка отправки команды воркеру', true);
        }
      }
    });

    document.body.addEventListener('htmx:sseMessage', function(evt) {
      const logs = document.getElementById('worker-logs');
      if (logs) {
        logs.scrollTop = logs.scrollHeight;
      }
    });
  </script>
</body>
</html>
